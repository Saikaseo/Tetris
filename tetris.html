<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>テトリス</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>🎮 TETRIS</h1>

<div id="game-info">
    <div class="info-box">
        SCORE<br>
        <span id="score">0</span>
    </div>

    <div class="info-box">
        LEVEL<br>
        <span id="level">1</span>
    </div>

    <div class="info-box">
        LINES<br>
        <span id="lines">0</span>
    </div>
</div>

<div id="game-container">

    <div id="board"></div>

    <div id="side-panel">

    <div id="next-title">HOLD</div>
    <div id="hold"></div>

    <div id="next-title" style="margin-top:10px;">
        NEXT
    </div>

    <div id="next"></div>

</div>

</div>

<!-- スマホ操作 -->

<div id="buttons">

    <button id="left">←</button>

    <button id="rotate">↻</button>

    <button id="right">→</button>

    <button id="down">↓</button>

    <button id="hold-button">HOLD</button>

    <button id="undo">↶</button>

    <button id="pause">Ⅱ</button>

</div>

<button id="restart">🔄 RESTART</button>


<!-- ゲームオーバー画面 -->

<div id="game-over">

    <div id="game-over-box">

        <div id="game-over-title">
            GAME OVER
        </div>

        <div id="final-score">
            SCORE: <span id="final-score-number">0</span>
        </div>

        <button id="game-over-restart">
            もう一度遊ぶ
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
