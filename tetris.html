<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>テトリス</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
    touch-action: none;
}

h1 {
    margin: 10px 0 5px;
    font-size: 28px;
}

#game-info {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 8px;
    font-size: 16px;
}

.info-box {
    background: #222;
    border-radius: 8px;
    padding: 5px 12px;
    min-width: 90px;
}

#game-container {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 15px;
}

#board {
    position: relative;
    background: #222;
    border: 3px solid #555;

    /*
      10列 × 20行
    */
    width: min(60vw, 300px);
    height: calc(min(60vw, 300px) * 2);

    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(20, 1fr);
}

.cell {
    border: 1px solid rgba(255,255,255,0.05);
    background: #1b1b1b;
}

.cell.filled {
    border: 2px solid rgba(255,255,255,0.25);
}

/* テトリミノの色 */

.I {
    background: #00ffff !important;
}

.O {
    background: #ffff00 !important;
}

.T {
    background: #aa00ff !important;
}

.S {
    background: #00cc44 !important;
}

.Z {
    background: #ff3333 !important;
}

.J {
    background: #3366ff !important;
}

.L {
    background: #ff8800 !important;
}

#side-panel {
    width: 120px;
}

#next-title {
    font-size: 14px;
    margin-bottom: 5px;
}

#next {
    width: 100px;
    height: 100px;
    margin: auto;
    background: #222;
    border: 2px solid #555;

    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
}

.next-cell {
    border: 1px solid rgba(255,255,255,0.03);
}

/* ボタン */

#buttons {
    width: min(95vw, 420px);
    margin: 12px auto 0;

    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
}

button {
    border: none;
    border-radius: 10px;
    background: #333;
    color: white;

    font-size: 20px;
    font-weight: bold;

    min-height: 52px;

    box-shadow: 0 3px 0 #111;
}

button:active {
    transform: translateY(3px);
    box-shadow: none;
    background: #555;
}

#rotate {
    background: #663399;
}

#drop {
    background: #444;
}

#restart {
    width: min(95vw, 420px);
    margin: 8px auto;
    display: block;

    font-size: 18px;
    background: #0066cc;
}

/* ゲームオーバー */

#game-over {
    position: fixed;
    inset: 0;

    display: none;

    justify-content: center;
    align-items: center;

    background: rgba(0,0,0,0.75);

    z-index: 100;
}

#game-over-box {
    background: #222;
    border: 2px solid #666;
    border-radius: 15px;

    padding: 25px 35px;

    box-shadow: 0 10px 30px black;
}

#game-over-title {
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 15px;
}

#final-score {
    font-size: 20px;
    margin-bottom: 20px;
}

#game-over button {
    background: #0066cc;
    padding: 10px 30px;
}

/* PC */

@media (min-width: 700px) {

    h1 {
        margin-top: 15px;
        font-size: 32px;
    }

    #buttons {
        display: none;
    }

    #restart {
        width: 200px;
    }

    #board {
        width: 300px;
        height: 600px;
    }
}

/* スマホ縦画面 */

@media (max-width: 699px) {

    h1 {
        font-size: 24px;
        margin-top: 5px;
    }

    #game-info {
        margin-bottom: 4px;
    }

    #side-panel {
        width: 75px;
    }

    #next {
        width: 65px;
        height: 65px;
    }

    #next-title {
        font-size: 11px;
    }

    #game-container {
        gap: 8px;
    }

    #buttons {
        margin-top: 7px;
    }

    button {
        min-height: 45px;
        font-size: 18px;
    }

    #restart {
        margin-top: 5px;
        min-height: 40px;
    }
}

/* 横向きスマホ */

@media (max-height: 600px) {

    h1 {
        display: none;
    }

    #game-info {
        margin-top: 3px;
    }

    #buttons {
        margin-top: 4px;
    }

    button {
        min-height: 38px;
    }

    #restart {
        min-height: 35px;
        margin-top: 3px;
    }
}
</style>
</head>

<body>

<h1>🎮 TETRIS</h1>

<div id="game-info">
    <div class="info-box">
        SCORE<br>
        <span id="score">0</span>
    </div>

    <div class="info-box">
        LEVEL<br>
        <span id="level">1</span>
    </div>

    <div class="info-box">
        LINES<br>
        <span id="lines">0</span>
    </div>
</div>

<div id="game-container">

    <div id="board"></div>

    <div id="side-panel">
        <div id="next-title">NEXT</div>
        <div id="next"></div>
    </div>

</div>

<!-- スマホ操作 -->

<div id="buttons">

    <button id="left">←</button>

    <button id="rotate">↻</button>

    <button id="right">→</button>

    <button id="down">↓</button>

    <button id="drop">DROP</button>

    <button id="pause">Ⅱ</button>

</div>

<button id="restart">🔄 RESTART</button>


<!-- ゲームオーバー画面 -->

<div id="game-over">

    <div id="game-over-box">

        <div id="game-over-title">
            GAME OVER
        </div>

        <div id="final-score">
            SCORE: <span id="final-score-number">0</span>
        </div>

        <button id="game-over-restart">
            もう一度遊ぶ
        </button>

    </div>

</div>


<script>

/* =========================================================
   基本設定
========================================================= */

const COLS = 10;
const ROWS = 20;

let board = [];

let score = 0;
let lines = 0;
let level = 1;

let gameOver = false;
let paused = false;

let dropTimer = null;


/* =========================================================
   テトリミノ
========================================================= */

const PIECES = {

    I: {
        color: "I",
        shape: [
            [1,1,1,1]
        ]
    },

    O: {
        color: "O",
        shape: [
            [1,1],
            [1,1]
        ]
    },

    T: {
        color: "T",
        shape: [
            [0,1,0],
            [1,1,1]
        ]
    },

    S: {
        color: "S",
        shape: [
            [0,1,1],
            [1,1,0]
        ]
    },

    Z: {
        color: "Z",
        shape: [
            [1,1,0],
            [0,1,1]
        ]
    },

    J: {
        color: "J",
        shape: [
            [1,0,0],
            [1,1,1]
        ]
    },

    L: {
        color: "L",
        shape: [
            [0,0,1],
            [1,1,1]
        ]
    }

};

const PIECE_NAMES = [
    "I",
    "O",
    "T",
    "S",
    "Z",
    "J",
    "L"
];


/* =========================================================
   現在のブロック
========================================================= */

let current = null;
let nextPiece = null;


/* =========================================================
   盤面作成
========================================================= */

function createBoard() {

    board = [];

    for (let y = 0; y < ROWS; y++) {

        board[y] = [];

        for (let x = 0; x < COLS; x++) {

            board[y][x] = null;

        }

    }

}


/* =========================================================
   盤面表示
========================================================= */

function drawBoard() {

    const boardElement =
        document.getElementById("board");

    boardElement.innerHTML = "";

    for (let y = 0; y < ROWS; y++) {

        for (let x = 0; x < COLS; x++) {

            const cell =
                document.createElement("div");

            cell.className = "cell";

            if (board[y][x]) {

                cell.classList.add("filled");

                cell.classList.add(
                    board[y][x]
                );

            }

            boardElement.appendChild(cell);

        }

    }

    drawCurrentPiece();

}


/* =========================================================
   現在のブロックを描画
========================================================= */

function drawCurrentPiece() {

    if (!current) return;

    for (let y = 0;
         y < current.shape.length;
         y++) {

        for (let x = 0;
             x < current.shape[y].length;
             x++) {

            if (!current.shape[y][x])
                continue;

            const boardX =
                current.x + x;

            const boardY =
                current.y + y;

            if (
                boardX >= 0 &&
                boardX < COLS &&
                boardY >= 0 &&
                boardY < ROWS
            ) {

                const index =
                    boardY * COLS + boardX;

                const cell =
                    document.getElementById("board")
                    .children[index];

                cell.classList.add("filled");
                cell.classList.add(current.color);

            }

        }

    }

}


/* =========================================================
   ランダムなブロック
========================================================= */

function randomPiece() {

    const name =
        PIECE_NAMES[
            Math.floor(
                Math.random() *
                PIECE_NAMES.length
            )
        ];

    const data = PIECES[name];

    return {

        color: data.color,

        shape: data.shape.map(
            row => [...row]
        ),

        x: Math.floor(
            (COLS - data.shape[0].length) / 2
        ),

        y: 0

    };

}


/* =========================================================
   ブロック生成
========================================================= */

function spawnPiece() {

    current = nextPiece || randomPiece();

    nextPiece = randomPiece();

    drawNext();

    current.x =
        Math.floor(
            (COLS -
             current.shape[0].length) / 2
        );

    current.y = 0;


    if (collision(
        current.x,
        current.y,
        current.shape
    )) {

        endGame();

    }

}


/* =========================================================
   NEXT表示
========================================================= */

function drawNext() {

    const next =
        document.getElementById("next");

    next.innerHTML = "";

    for (let i = 0; i < 16; i++) {

        const cell =
            document.createElement("div");

        cell.className = "next-cell";

        next.appendChild(cell);

    }

    if (!nextPiece) return;

    const shape =
        nextPiece.shape;

    const offsetX =
        Math.floor(
            (4 - shape[0].length) / 2
        );

    const offsetY =
        Math.floor(
            (4 - shape.length) / 2
        );

    for (
        let y = 0;
        y < shape.length;
        y++
    ) {

        for (
            let x = 0;
            x < shape[y].length;
            x++
        ) {

            if (!shape[y][x])
                continue;

            const px =
                offsetX + x;

            const py =
                offsetY + y;

            if (
                px >= 0 &&
                px < 4 &&
                py >= 0 &&
                py < 4
            ) {

                const index =
                    py * 4 + px;

                next.children[index]
                    .classList.add(
                        "filled"
                    );

                next.children[index]
                    .classList.add(
                        nextPiece.color
                    );

            }

        }

    }

}


/* =========================================================
   衝突判定
========================================================= */

function collision(x, y, shape) {

    for (
        let sy = 0;
        sy < shape.length;
        sy++
    ) {

        for (
            let sx = 0;
            sx < shape[sy].length;
            sx++
        ) {

            if (!shape[sy][sx])
                continue;

            const boardX =
                x + sx;

            const boardY =
                y + sy;


            /* 左右の壁 */

            if (
                boardX < 0 ||
                boardX >= COLS
            ) {

                return true;

            }


            /* 底 */

            if (
                boardY >= ROWS
            ) {

                return true;

            }


            /* 他のブロック */

            if (
                boardY >= 0 &&
                board[boardY][boardX]
            ) {

                return true;

            }

        }

    }

    return false;

}


/* =========================================================
   左右移動
========================================================= */

function moveHorizontal(direction) {

    if (gameOver || paused)
        return;

    const newX =
        current.x + direction;

    if (
        !collision(
            newX,
            current.y,
            current.shape
        )
    ) {

        current.x = newX;

        drawBoard();

    }

}


/* =========================================================
   下移動
========================================================= */

function moveDown() {

    if (gameOver || paused)
        return;

    if (
        !collision(
            current.x,
            current.y + 1,
            current.shape
        )
    ) {

        current.y++;

        drawBoard();

    } else {

        lockPiece();

    }

}


/* =========================================================
   一気に落とす
========================================================= */

function hardDrop() {

    if (gameOver || paused)
        return;

    let distance = 0;

    while (
        !collision(
            current.x,
            current.y + 1,
            current.shape
        )
    ) {

        current.y++;

        distance++;

    }

    score += distance * 2;

    updateInfo();

    lockPiece();

}


/* =========================================================
   回転
========================================================= */

function rotatePiece() {

    if (gameOver || paused)
        return;

    const oldShape =
        current.shape;

    const height =
        oldShape.length;

    const width =
        oldShape[0].length;

    const newShape = [];

    for (
        let x = 0;
        x < width;
        x++
    ) {

        newShape[x] = [];

        for (
            let y = height - 1;
            y >= 0;
            y--
        ) {

            newShape[x].push(
                oldShape[y][x]
            );

        }

    }


    /* 回転後の衝突チェック */

    if (
        !collision(
            current.x,
            current.y,
            newShape
        )
    ) {

        current.shape = newShape;

        drawBoard();

        return;

    }


    /* 壁際なら少しずらしてみる */

    const offsets = [
        -1,
        1,
        -2,
        2
    ];

    for (const offset of offsets) {

        if (
            !collision(
                current.x + offset,
                current.y,
                newShape
            )
        ) {

            current.x += offset;

            current.shape =
                newShape;

            drawBoard();

            return;

        }

    }

}


/* =========================================================
   ブロック固定
========================================================= */

function lockPiece() {

    for (
        let y = 0;
        y < current.shape.length;
        y++
    ) {

        for (
            let x = 0;
            x < current.shape[y].length;
            x++
        ) {

            if (!current.shape[y][x])
                continue;

            const boardX =
                current.x + x;

            const boardY =
                current.y + y;

            if (
                boardY >= 0 &&
                boardY < ROWS
            ) {

                board[boardY][boardX] =
                    current.color;

            }

        }

    }


    clearLines();

    spawnPiece();

    drawBoard();

}


/* =========================================================
   ライン消去
========================================================= */

function clearLines() {

    let cleared = 0;

    for (
        let y = ROWS - 1;
        y >= 0;
        y--
    ) {

        let full = true;

        for (
            let x = 0;
            x < COLS;
            x++
        ) {

            if (!board[y][x]) {

                full = false;

                break;

            }

        }


        if (full) {

            board.splice(y, 1);

            board.unshift(
                new Array(COLS).fill(null)
            );

            cleared++;

            y++;

        }

    }


    if (cleared > 0) {

        lines += cleared;


        /* スコア */

        const scores = [
            0,
            100,
            300,
            500,
            800
        ];

        score +=
            scores[cleared] * level;


        /* レベル */

        level =
            Math.floor(lines / 10) + 1;

        updateInfo();

        restartTimer();

    }

}


/* =========================================================
   情報表示
========================================================= */

function updateInfo() {

    document.getElementById("score")
        .textContent = score;

    document.getElementById("level")
        .textContent = level;

    document.getElementById("lines")
        .textContent = lines;

}


/* =========================================================
   落下速度
========================================================= */

function getDropSpeed() {

    return Math.max(
        80,
        800 - (level - 1) * 70
    );

}


/* =========================================================
   タイマー
========================================================= */

function restartTimer() {

    clearInterval(dropTimer);

    dropTimer =
        setInterval(
            moveDown,
            getDropSpeed()
        );

}


/* =========================================================
   ゲームオーバー
========================================================= */

function endGame() {

    gameOver = true;

    clearInterval(dropTimer);

    document.getElementById(
        "final-score-number"
    ).textContent = score;

    document.getElementById(
        "game-over"
    ).style.display = "flex";

}


/* =========================================================
   ゲーム開始
========================================================= */

function startGame() {

    clearInterval(dropTimer);

    createBoard();

    score = 0;
    lines = 0;
    level = 1;

    gameOver = false;
    paused = false;

    nextPiece = randomPiece();

    spawnPiece();

    updateInfo();

    drawBoard();

    restartTimer();

}


/* =========================================================
   一時停止
========================================================= */

function togglePause() {

    if (gameOver)
        return;

    paused = !paused;

    const button =
        document.getElementById("pause");

    if (paused) {

        button.textContent = "▶";

    } else {

        button.textContent = "Ⅱ";

    }

}


/* =========================================================
   キーボード操作
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (gameOver)
            return;


        if (
            event.key === "ArrowLeft"
        ) {

            event.preventDefault();

            moveHorizontal(-1);

        }


        else if (
            event.key === "ArrowRight"
        ) {

            event.preventDefault();

            moveHorizontal(1);

        }


        else if (
            event.key === "ArrowDown"
        ) {

            event.preventDefault();

            moveDown();

        }


        else if (
            event.key === "ArrowUp"
        ) {

            event.preventDefault();

            rotatePiece();

        }


        else if (
            event.code === "Space"
        ) {

            event.preventDefault();

            hardDrop();

        }


        else if (
            event.key.toLowerCase() === "r"
        ) {

            startGame();

        }

    }
);


/* =========================================================
   スマホボタン
========================================================= */

document.getElementById("left")
    .addEventListener(
        "pointerdown",
        function(event) {

            event.preventDefault();

            moveHorizontal(-1);

        }
    );


document.getElementById("right")
    .addEventListener(
        "pointerdown",
        function(event) {

            event.preventDefault();

            moveHorizontal(1);

        }
    );


document.getElementById("down")
    .addEventListener(
        "pointerdown",
        function(event) {

            event.preventDefault();

            moveDown();

        }
    );


document.getElementById("rotate")
    .addEventListener(
        "pointerdown",
        function(event) {

            event.preventDefault();

            rotatePiece();

        }
    );


document.getElementById("drop")
    .addEventListener(
        "pointerdown",
        function(event) {

            event.preventDefault();

            hardDrop();

        }
    );


document.getElementById("pause")
    .addEventListener(
        "pointerdown",
        function(event) {

            event.preventDefault();

            togglePause();

        }
    );


/* =========================================================
   リスタート
========================================================= */

document.getElementById("restart")
    .addEventListener(
        "click",
        startGame
    );


document.getElementById(
    "game-over-restart"
)
.addEventListener(
    "click",
    function() {

        document.getElementById(
            "game-over"
        ).style.display = "none";

        startGame();

    }
);


/* =========================================================
   スマホのスワイプ操作
========================================================= */

let touchStartX = 0;
let touchStartY = 0;

document.addEventListener(
    "touchstart",
    function(event) {

        if (
            event.target.tagName === "BUTTON"
        ) {
            return;
        }

        const touch =
            event.touches[0];

        touchStartX =
            touch.clientX;

        touchStartY =
            touch.clientY;

    },
    { passive: true }
);


document.addEventListener(
    "touchend",
    function(event) {

        if (gameOver || paused)
            return;

        if (
            event.target.tagName === "BUTTON"
        ) {
            return;
        }

        const touch =
            event.changedTouches[0];

        const dx =
            touch.clientX -
            touchStartX;

        const dy =
            touch.clientY -
            touchStartY;

        const absX =
            Math.abs(dx);

        const absY =
            Math.abs(dy);


        /* 小さすぎる動き */

        if (
            Math.max(absX, absY) < 25
        ) {

            return;

        }


        /* 横スワイプ */

        if (absX > absY) {

            if (dx > 0) {

                moveHorizontal(1);

            } else {

                moveHorizontal(-1);

            }

        }


        /* 縦スワイプ */

        else {

            if (dy > 0) {

                moveDown();

            } else {

                rotatePiece();

            }

        }

    },
    { passive: true }
);


/* =========================================================
   ゲーム開始
========================================================= */

startGame();

</script>

</body>
</html>
